  <rect x="872" y="132" width="120" height="8" fill="#0f1d14"/><text class="mono" x="878" y="138.5" font-size="5.5" fill="#7d8f7a">heal_pipeline.py</text><rect class="blink" x="880" y="182" width="5" height="3" fill="#e4f2dc"/><rect x="872" y="132" width="120" height="56" fill="url(#scan)" opacity="0.5"/><rect class="soft" x="872" y="132" width="120" height="56" fill="#b8c9b3" opacity="0.06"/>
  <rect x="988" y="136" width="10" height="10" fill="#ffd27a" opacity="0.85" transform="rotate(6 993 141)"/><line x1="990" y1="140" x2="996" y2="140" stroke="#5a4a1a" stroke-width="0.8"/><line x1="990" y1="143" x2="995" y2="143" stroke="#5a4a1a" stroke-width="0.8"/><rect x="866" y="178" width="8" height="8" fill="#7d8f7a" opacity="0.8" transform="rotate(-8 870 182)"/>
  <polygon points="880,205 968,205 972,200 884,200" fill="#141714" stroke="#2a2d29" stroke-width="0.6"/><g fill="#2a2f29" opacity="0.8"><rect x="886" y="201.3" width="5" height="1.4"/><rect x="894" y="201.3" width="5" height="1.4"/><rect x="902" y="201.3" width="5" height="1.4"/><rect x="910" y="201.3" width="5" height="1.4"/><rect x="918" y="201.3" width="5" height="1.4"/><rect x="926" y="201.3" width="5" height="1.4"/><rect x="934" y="201.3" width="5" height="1.4"/><rect x="942" y="201.3" width="5" height="1.4"/><rect x="950" y="201.3" width="5" height="1.4"/><rect x="958" y="201.3" width="5" height="1.4"/></g><ellipse cx="992" cy="203" rx="6" ry="3" fill="#161816" stroke="#2a2d29" stroke-width="0.6"/><rect x="1026" y="190" width="14" height="16" rx="1" fill="#161816" stroke="#2f342d" stroke-width="0.8"/><path d="M1040 194 Q1048 194 1048 200 Q1048 205 1040 204" fill="none" stroke="#2f342d" stroke-width="2"/><ellipse cx="1033" cy="190.5" rx="6" ry="1.3" fill="#3a2a1a"/><ellipse class="steam2" cx="1033" cy="187" rx="5" ry="3" fill="#cfe3c8"/><ellipse class="steam2" cx="1033" cy="187" rx="5" ry="3" fill="#cfe3c8" style="animation-delay:-2.5s"/><rect x="1060" y="200" width="30" height="6" fill="#d8d2c0" opacity="0.22" transform="rotate(-3 1075 203)"/><rect x="1062" y="196" width="28" height="6" fill="#d8d2c0" opacity="0.16" transform="rotate(4 1076 199)"/>
