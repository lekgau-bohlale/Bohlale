<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="An empty workstation with the screen still on">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070807"/>
      <stop offset="0.6" stop-color="#0d0f0d"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9e0c0" stop-opacity="0.42"/>
      <stop offset="0.5" stop-color="#9fb89a" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#9fb89a" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="rust" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a2a10" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5a2a10" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.4" cy="0.35" r="0.85">
      <stop offset="0.4" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.85"/>
    </radialGradient>
    <radialGradient id="puddle" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b9d3b2" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#b9d3b2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="corrugated" width="14" height="280" patternUnits="userSpaceOnUse">
      <rect width="7" height="280" fill="#ffffff" fill-opacity="0.025"/>
      <rect x="7" width="7" height="280" fill="#000000" fill-opacity="0.18"/>
    </pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="blur6" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="blur14" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" seed="3" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="3"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: "Courier New", Courier, monospace; font-weight: 700; }
    .flick  { animation: flick 7s step-end infinite; }
    .flick2 { animation: flick 7s step-end infinite; animation-delay: -2.3s; }
    .flickL { animation: flick 7s step-end infinite; animation-delay: -4.1s; }
    .slow   { animation: slow 11s step-end infinite; }
    .dying  { animation: dying 9s step-end infinite; }
    .spark  { animation: spark 8s step-end infinite; }
    .drift  { animation: drift 14s linear infinite; }
    .drift2 { animation: drift 19s linear infinite; animation-delay: -6s; }
    .sway   { animation: sway 6s ease-in-out infinite; transform-origin: 950px 0px; }

    @keyframes flick {
      0%   { opacity: 1; }
      4%   { opacity: 0.15; }
      5%   { opacity: 0.9; }
      6%   { opacity: 0.1; }
      8%   { opacity: 1; }
      41%  { opacity: 0.85; }
      42%  { opacity: 1; }
      55%  { opacity: 0.3; }
      56%  { opacity: 1; }
      58%  { opacity: 0.12; }
      59%  { opacity: 0.7; }
      60%  { opacity: 0.05; }
      63%  { opacity: 1; }
      88%  { opacity: 0.6; }
      89%  { opacity: 1; }
      100% { opacity: 1; }
    }
    @keyframes slow {
      0%   { opacity: 0.85; }
      30%  { opacity: 0.4; }
      32%  { opacity: 0.85; }
      70%  { opacity: 0.55; }
      72%  { opacity: 0.2; }
      75%  { opacity: 0.85; }
      100% { opacity: 0.85; }
    }
    @keyframes dying {
      0%   { opacity: 0.18; }
      12%  { opacity: 0.9; }
      13%  { opacity: 0.1; }
      14%  { opacity: 0.6; }
      15%  { opacity: 0.12; }
      60%  { opacity: 0.18; }
      100% { opacity: 0.18; }
    }
    @keyframes spark {
      0%   { opacity: 0; }
      52%  { opacity: 0; }
      53%  { opacity: 1; }
      54%  { opacity: 0; }
      55%  { opacity: 0.8; }
      56%  { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes drift {
      0%   { transform: translate(0px, 0px); opacity: 0; }
      10%  { opacity: 0.5; }
      90%  { opacity: 0.4; }
      100% { transform: translate(40px, -60px); opacity: 0; }
    }
    @keyframes sway {
      0%, 100% { transform: rotate(-0.6deg); }
      50%      { transform: rotate(0.6deg); }
    }
  
    .scroll { animation: scrollcode 8s steps(8) infinite; }
    .heal   { animation: heal 9s step-end infinite; }
    .heal2  { animation: heal2 9s step-end infinite; }
    .steam2 { transform-box: fill-box; transform-origin: center; animation: steam2 5s ease-out infinite; }
    @keyframes scrollcode { 0% { transform: translateY(0px); } 100% { transform: translateY(-48px); } }
    @keyframes heal  { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }
    @keyframes heal2 { 0%, 55% { opacity: 0; } 56%, 100% { opacity: 1; } }
    @keyframes steam2 {
      0% { transform: translate(0px, 0px) scale(0.6); opacity: 0; } 20% { opacity: 0.3; }
      100% { transform: translate(6px, -34px) scale(1.7); opacity: 0; }
    }
  </style>

  <!-- wall -->
  <rect width="1200" height="280" fill="url(#wall)"/>
  <rect width="1200" height="280" fill="url(#corrugated)"/>

  <!-- rust streaks and water stains -->
  <rect x="80"  y="0" width="10" height="190" fill="url(#rust)"/>
  <rect x="330" y="0" width="6"  height="120" fill="url(#rust)"/>
  <rect x="760" y="0" width="14" height="230" fill="url(#rust)"/>
  <rect x="1090" y="0" width="8" height="160" fill="url(#rust)"/>

  <!-- overhead pipe and cables -->
  <rect x="0" y="14" width="1200" height="12" fill="#161816"/>
  <rect x="0" y="14" width="1200" height="2" fill="#2a2d29"/>
  <path d="M 0 40 Q 200 70 420 38 T 800 48 T 1200 36" stroke="#1b1d1a" stroke-width="3" fill="none"/>
  <path d="M 0 52 Q 300 90 600 50 T 1200 60" stroke="#141513" stroke-width="2" fill="none"/>

  <!-- ===== working-ish light (flickering) ===== -->
  <g>
    <!-- chains -->
    <line x1="425" y1="26" x2="425" y2="70" stroke="#2a2d29" stroke-width="2"/>
    <line x1="515" y1="26" x2="515" y2="70" stroke="#2a2d29" stroke-width="2"/>

    <!-- light cone + glow -->
    <g class="flick">
      <polygon points="418,86 522,86 760,280 180,280" fill="url(#cone)"/>
      <ellipse cx="470" cy="82" rx="110" ry="22" fill="#b9d3b2" opacity="0.35" filter="url(#blur14)"/>
      <ellipse cx="470" cy="82" rx="70" ry="8" fill="#e8f5e0" opacity="0.7" filter="url(#blur6)"/>
    </g>

    <!-- housing -->
    <rect x="408" y="68" width="124" height="14" fill="#1a1c1a"/>
    <rect x="408" y="68" width="124" height="2" fill="#343833"/>
    <!-- tube -->
    <rect x="416" y="82" width="108" height="6" rx="3" fill="#2a2f29"/>
    <rect class="flick" x="416" y="82" width="108" height="6" rx="3" fill="#e4f2dc"/>
  </g>

  <!-- ===== broken light (mostly dead) ===== -->
  <g class="sway">
    <line x1="905" y1="26" x2="905" y2="70" stroke="#2a2d29" stroke-width="2"/>
    <line x1="995" y1="26" x2="1000" y2="84" stroke="#2a2d29" stroke-width="2"/>
    <g transform="rotate(5 950 80)">
      <rect x="888" y="68" width="124" height="14" fill="#151715"/>
      <rect x="896" y="82" width="108" height="6" rx="3" fill="#1d201c"/>
      <rect class="dying" x="896" y="82" width="52" height="6" rx="3" fill="#a9c0a2"/>
      <ellipse class="dying" cx="920" cy="86" rx="46" ry="12" fill="#a9c0a2" opacity="0.5" filter="url(#blur6)"/>
    </g>
    <circle class="spark" cx="1004" cy="96" r="2.5" fill="#ffd27a"/>
    <circle class="spark" cx="1010" cy="104" r="1.5" fill="#ffd27a"/>
  </g>

  <!-- floor -->
  <rect x="0" y="238" width="1200" height="42" fill="#050605"/>
  <rect x="0" y="238" width="1200" height="1" fill="#1d201c"/>
  <ellipse class="flick" cx="470" cy="262" rx="230" ry="14" fill="url(#puddle)"/>
  <g class="mono" font-size="13" letter-spacing="2">
    <text class="slow" x="96" y="214" fill="#7d8f7a">&gt; AI DATA ENGINEER // PIPELINES THAT FIX THEMSELVES_</text>
  </g>

  <!-- stencil tag on the wall -->
  <g class="mono" font-size="11" letter-spacing="2" fill="#4a4f47">
    <text x="40" y="250" transform="rotate(-90 40 250)">ETL · RAG · MCP</text>
    <text x="1186" y="262" text-anchor="end">JOHANNESBURG</text>
  </g>

  <!-- floating dust in the light -->
  <g fill="#cfe3c8">
    <circle class="drift"  cx="400" cy="200" r="1.4"/>
    <circle class="drift2" cx="520" cy="220" r="1.1"/>
    <circle class="drift"  cx="600" cy="170" r="1.2" style="animation-delay:-9s"/>
    <circle class="drift2" cx="340" cy="150" r="1"   style="animation-delay:-12s"/>
  </g>

  <!-- ===== abandoned workstation ===== -->
  <defs><clipPath id="scr"><rect x="872" y="132" width="120" height="56"/></clipPath><clipPath id="scr2"><rect x="810" y="138" width="42" height="52"/></clipPath></defs>
  <g class="soft"><ellipse cx="932" cy="150" rx="150" ry="80" fill="#b8c9b3" opacity="0.13" filter="url(#blur14)"/><polygon points="872,196 992,196 1060,238 800,238" fill="url(#cone)" opacity="0.8"/></g>
  <rect class="soft" x="840" y="239" width="190" height="30" fill="#b8c9b3" opacity="0.10" filter="url(#blur6)"/>
  <g transform="rotate(-7 712 230)"><rect x="706" y="226" width="4" height="14" fill="#1a1c1a"/><line x1="690" y1="242" x2="732" y2="242" stroke="#1a1c1a" stroke-width="3"/><circle cx="690" cy="245" r="2.5" fill="#101210"/><circle cx="732" cy="245" r="2.5" fill="#101210"/><circle cx="711" cy="245" r="2.5" fill="#101210"/><rect x="688" y="218" width="48" height="8" rx="3" fill="#171a17"/><rect x="688" y="218" width="48" height="1.5" fill="#2f342d"/><rect x="684" y="168" width="10" height="54" rx="4" fill="#151815"/><rect x="684" y="168" width="2" height="54" fill="#2f342d" opacity="0.7"/><path d="M679 176 Q696 172 700 188 L702 226 Q690 232 680 224 Z" fill="#1e211d"/><path d="M679 176 Q696 172 700 188 L702 226 Q690 232 680 224 Z" fill="#000" opacity="0.25"/><path d="M681 180 L698 184" stroke="#7a2e0a" stroke-width="1.2" opacity="0.8"/></g>
  <rect x="760" y="206" width="380" height="7" fill="#171a17"/><rect x="760" y="206" width="380" height="1.5" fill="#343833"/><rect x="770" y="213" width="360" height="5" fill="#0c0e0c"/><rect x="772" y="213" width="6" height="31" fill="#101210"/><rect x="1122" y="213" width="6" height="31" fill="#101210"/><rect x="1090" y="218" width="30" height="22" fill="#0e100e" stroke="#2a2d29"/><rect x="1100" y="227" width="10" height="2" fill="#4a4f47"/>
  <rect x="796" y="190" width="6" height="16" fill="#101210"/><rect x="826" y="196" width="12" height="10" fill="#101210"/><rect x="806" y="134" width="50" height="60" fill="#0b0d0b" stroke="#2a2d29"/><rect x="810" y="138" width="42" height="52" fill="#07100a"/>
  <g clip-path="url(#scr2)" class="soft2"><path d="M818 148 L818 160 L832 160 M832 160 L832 172 M832 160 L846 160 L846 172 M818 172 L832 184 M846 172 L832 184" stroke="#7d8f7a" stroke-width="1" fill="none"/><rect x="815" y="145" width="7" height="6" fill="#b8c9b3"/><rect x="829" y="157" width="7" height="6" fill="#b8c9b3"/><rect x="843" y="169" width="7" height="6" fill="#b8c9b3"/><rect x="815" y="169" width="7" height="6" fill="#b8c9b3"/><rect class="heal"  x="829" y="181" width="7" height="6" fill="#b3341a"/><rect class="heal2" x="829" y="181" width="7" height="6" fill="#b8c9b3"/><rect class="heal"  x="810" y="138" width="42" height="52" fill="#b3341a" opacity="0.08"/><text class="mono" x="814" y="195" font-size="5" fill="#7d8f7a">retry 3/3</text></g>
  <rect x="924" y="194" width="16" height="12" fill="#101210"/><rect x="910" y="204" width="44" height="3" fill="#161816"/><rect x="866" y="126" width="132" height="70" fill="#0b0d0b" stroke="#2a2d29"/><rect x="872" y="132" width="120" height="56" fill="#06100a"/>
  <g clip-path="url(#scr)"><g class="scroll"><rect x="880" y="142" width="48" height="2.4" fill="#e4f2dc" opacity="0.9"/><rect x="932" y="142" width="17" height="2.4" fill="#7d8f7a" opacity="0.8"/><rect x="888" y="148" width="62" height="2.4" fill="#7d8f7a" opacity="0.9"/><rect x="888" y="154" width="35" height="2.4" fill="#7d8f7a" opacity="0.9"/><rect x="927" y="154" width="13" height="2.4" fill="#7d8f7a" opacity="0.8"/><rect x="896" y="160" width="33" height="2.4" fill="#ffd27a" opacity="0.9"/><rect x="933" y="160" width="11" height="2.4" fill="#7d8f7a" opacity="0.8"/><rect x="896" y="166" width="37" height="2.4" fill="#b8c9b3" opacity="0.9"/><rect x="880" y="172" width="45" height="2.4" fill="#ffd27a" opacity="0.9"/><rect x="888" y="178" width="26" height="2.4" fill="#b8c9b3" opacity="0.9"/><rect x="880" y="184" width="36" height="2.4" fill="#e4f2dc" opacity="0.9"/><rect x="880" y="190" width="48" height="2.4" fill="#e4f2dc" opacity="0.9"/><rect x="932" y="190" width="17" height="2.4" fill="#7d8f7a" opacity="0.8"/><rect x="888" y="196" width="62" height="2.4" fill="#7d8f7a" opacity="0.9"/><rect x="888" y="202" width="35" height="2.4" fill="#7d8f7a" opacity="0.9"/><rect x="927" y="202" width="20" height="2.4" fill="#7d8f7a" opacity="0.8"/><rect x="896" y="208" width="33" height="2.4" fill="#ffd27a" opacity="0.9"/><rect x="933" y="208" width="8" height="2.4" fill="#7d8f7a" opacity="0.8"/><rect x="896" y="214" width="37" height="2.4" fill="#b8c9b3" opacity="0.9"/><rect x="880" y="220" width="45" height="2.4" fill="#ffd27a" opacity="0.9"/><rect x="929" y="220" width="13" height="2.4" fill="#7d8f7a" opacity="0.8"/><rect x="888" y="226" width="26" height="2.4" fill="#b8c9b3" opacity="0.9"/><rect x="918" y="226" width="16" height="2.4" fill="#7d8f7a" opacity="0.8"/><rect x="880" y="232" width="36" height="2.4" fill="#e4f2dc" opacity="0.9"/><rect x="920" y="232" width="19" height="2.4" fill="#7d8f7a" opacity="0.8"/><rect x="880" y="238" width="48" height="2.4" fill="#e4f