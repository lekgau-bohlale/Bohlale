<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 268" width="1000" height="268" role="img" aria-label="GOVERNED SELF-HEALING TRAFFIC TELEMETRY LAKEHOUSE. Engineered a platform that detects pipeline outages, diagnoses root causes and executes governed recovery workflows. Connected an MCP agent to Airflow logs and pgvector embeddings to automatically pinpoint failure causes, and built a tiered remediation engine that auto-runs safe fixes (retries, backfills) and routes high-risk changes to human approval. Stack: S3, boto3, Airflow, MCP, pgvector"><title>GOVERNED SELF-HEALING TRAFFIC TELEMETRY LAKEHOUSE. Engineered a platform that detects pipeline outages, diagnoses root causes and executes governed recovery workflows. Connected an MCP agent to Airflow logs and pgvector embeddings to automatically pinpoint failure causes, and built a tiered remediation engine that auto-runs safe fixes (retries, backfills) and routes high-risk changes to human approval. Stack: S3, boto3, Airflow, MCP, pgvector</title>
