  @keyframes soft { 0% {opacity:1} 18% {opacity:.55} 19% {opacity:1} 62% {opacity:.7} 63% {opacity:.4} 64% {opacity:1} 100% {opacity:1} }
  @keyframes blink { 0% {opacity:1} 50% {opacity:0} 100% {opacity:1} }
  @keyframes spark { 0% {opacity:0} 52% {opacity:0} 53% {opacity:1} 54% {opacity:0} 55% {opacity:.8} 56% {opacity:0} 100% {opacity:0} }
